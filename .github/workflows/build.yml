name: Build OpenSesame

# 本项目禁止本地编译, 所有构建都在 GitHub 云端完成。
# 构建环境: ddk (与 SakiSU 官方 LKM 相同的 GKI 官方构建环境)。
# 矩阵覆盖各 GKI KMI 分支, 每个分支产出一个 ko; 汇总任务打出全 KMI 一体包,
# 模块在设备上按 uname -r 自动选择 (SakiSU 式自动适配)。
on:
  push:
    branches: [ main ]
    paths: [ 'kernel/**', 'module/**', 'scripts/**', '.github/workflows/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kmi: [android14-6.1, android13-5.15, android14-5.15, android15-6.6]
        # ddk 还支持: android12-5.10, android13-5.10, android16-6.12 (后者
        # 需要 ddk README 提到的 Makefile.build 补丁), 需要时自行追加
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 ddk (SakiSU LKM 同款构建环境)
        run: |
          sudo curl -fsSL https://raw.githubusercontent.com/5ec1cff/ddk/main/scripts/ddk \
            -o /usr/local/bin/ddk
          sudo chmod +x /usr/local/bin/ddk

      - name: 编译内核模块 (${{ matrix.kmi }})
        run: |
          cd kernel
          ddk pull ${{ matrix.kmi }}
          ddk build --target ${{ matrix.kmi }}

      - name: 裁剪 ko 调试段
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm
          llvm-objcopy --strip-debug kernel/opensesame.ko

      - name: 打包单 KMI 模块
        run: |
          mkdir -p pkg
          cp -a module/. pkg/
          cp kernel/opensesame.ko pkg/opensesame.ko
          # 计算占位 vermagic 值的偏移与长度写入 offset 文件,
          # 设备端 (busybox grep 无 -a/-b) 就不需要在二进制里做查找了
          python3 - <<'EOF'
          data = open('kernel/opensesame.ko', 'rb').read()
          i = data.find(b'vermagic=')
          assert i >= 0, 'vermagic= not found in .modinfo'
          j = data.index(b'\0', i)
          print('vermagic value: offset=%d len=%d' % (i + 9, j - i - 9))
          open('pkg/opensesame.offset', 'w').write('%d %d\n' % (i + 9, j - i - 9))
          EOF
          cd pkg && zip -rq9 "$GITHUB_WORKSPACE/OpenSesame-${{ matrix.kmi }}.zip" .

      - name: 上传单 KMI 产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenSesame-${{ matrix.kmi }}
          path: OpenSesame-*.zip

  package-all:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载全部 KMI 产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: OpenSesame-*

      - name: 汇总多 KMI 一体包 (设备端按 uname -r 自动选择)
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          echo "--- 产物清单 ---"
          find artifacts -type f
          mkdir -p pkg/kos
          cp -a module/. pkg/
          python3 - <<'EOF'
          import glob, zipfile, os, sys
          found = []
          for z in sorted(glob.glob('artifacts/OpenSesame-*/*.zip')):
              base = os.path.basename(z)[:-4]
              kmi = base.replace('OpenSesame-', '')
              try:
                  # download-artifact 已解包: z 就是模块 zip 本体
                  mod = zipfile.ZipFile(z)
                  open(f'pkg/kos/opensesame-{kmi}.ko', 'wb').write(mod.read('opensesame.ko'))
                  open(f'pkg/kos/opensesame-{kmi}.offset', 'wb').write(mod.read('opensesame.offset'))
                  found.append(kmi)
                  print('收录:', kmi)
              except Exception as e:
                  print('!! 跳过', kmi, ':', e)
          print('汇总结果:', found)
          if 'android14-6.1' not in found:
              sys.exit('主目标 android14-6.1 缺失')
          EOF
          cd pkg && zip -rq9 "$GITHUB_WORKSPACE/OpenSesame-all-kmi.zip" .

      - name: 上传一体包
        uses: actions/upload-artifact@v4
        with:
          name: OpenSesame-all-kmi
          path: OpenSesame-all-kmi.zip
