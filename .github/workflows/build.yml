name: Build OpenSesame

# 本项目禁止本地编译, 所有构建都在 GitHub 云端完成。
# v0.1.4 起: 构建环境切换为 ddk (与 SakiSU LKM 完全相同的官方 GKI 构建环境)。
# 之前用源码树 + Ubuntu clang 自行 modules_prepare 的 ko 在本设备上存在
# struct module 布局错位, 加载必崩 (见 pstore 分析)。
on:
  push:
    branches: [ main ]
    paths: [ 'kernel/**', 'module/**', 'scripts/**', '.github/workflows/**' ]
  workflow_dispatch:

env:
  KMI: android14-6.1

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 ddk (SakiSU LKM 同款构建环境)
        run: |
          sudo curl -fsSL https://raw.githubusercontent.com/5ec1cff/ddk/main/scripts/ddk \
            -o /usr/local/bin/ddk
          sudo chmod +x /usr/local/bin/ddk

      - name: 编译内核模块 (android14-6.1)
        run: |
          cd kernel
          ddk pull ${{ env.KMI }}
          ddk build --target ${{ env.KMI }}

      - name: 裁剪 ko 调试段
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm
          llvm-objcopy --strip-debug kernel/opensesame.ko

      - name: 打包 KSU 模块
        run: |
          mkdir -p pkg
          cp module/* pkg/
          cp kernel/opensesame.ko pkg/opensesame.ko
          # 计算占位 vermagic 值的偏移与长度写入 offset 文件,
          # 设备端 (busybox grep 无 -a/-b) 就不需要在二进制里做查找了
          python3 - <<'EOF'
          data = open('kernel/opensesame.ko', 'rb').read()
          i = data.find(b'vermagic=')
          assert i >= 0, 'vermagic= not found in .modinfo'
          j = data.index(b'\0', i)
          print('vermagic value: offset=%d len=%d' % (i + 9, j - i - 9))
          open('pkg/opensesame.offset', 'w').write('%d %d\n' % (i + 9, j - i - 9))
          EOF
          cd pkg && zip -rq9 "$GITHUB_WORKSPACE/OpenSesame-${{ env.KMI }}.zip" .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenSesame-${{ env.KMI }}
          path: OpenSesame-*.zip
